name: Android APK
on:
  push:
    branches: ['arena/059cdeab-him-and-i']
  workflow_dispatch:
    inputs:
      server_url:
        description: Trusted deployed HTTPS web origin; empty uses the repository variable or builds an honest setup APK
        type: string
        required: false
      publish:
        description: Publish an explicitly labelled downloadable prerelease (not a production/store release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.CAPACITOR_SERVER_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, Node 24
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck && npm test && npm run db:check
      - name: Prepare truthful build metadata and version
        id: prepare
        run: node scripts/prepare-android.mjs
      - run: npm run native:sync
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile and lint Android
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: Package APK and checksum
        env:
          APK_MODE: ${{ steps.prepare.outputs.mode }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/android/HIM-and-I-${APK_MODE}-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "out/android/HIM-and-I-${APK_MODE}-debug.apk" > out/android/APK-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "out/android/HIM-and-I-${APK_MODE}-debug.apk" > out/android/APK-MANIFEST.txt
          grep -q "^package: name='io.github.mgnoies12.himandi'" out/android/APK-MANIFEST.txt
          grep -q "^sdkVersion:'24'" out/android/APK-MANIFEST.txt
          cd out/android
          sha256sum ./*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: him-and-i-android-apk
          path: out/android/
          if-no-files-found: error
          retention-days: 14
  publish-preview:
    needs: android
    if: >-
      github.repository == 'MGnoies12/him-and-i' &&
      github.ref == 'refs/heads/arena/059cdeab-him-and-i' &&
      (inputs.publish == true || contains(github.event.head_commit.message, '[apk-release]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: him-and-i-android-apk
          path: release-files
      - name: Require successful web, database and browser checks for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          CHECK_RUN=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_branch == "arena/059cdeab-him-and-i")][0].id // empty')
          test -n "$CHECK_RUN" || { echo "Push this branch and pass the matching web checks before publishing."; exit 1; }
          gh run watch "$CHECK_RUN" --exit-status
      - name: Publish requested, labelled prerelease; never merge or deploy production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: android-preview-${{ github.run_number }}-${{ github.run_attempt }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-files/*.apk release-files/SHA256SUMS.txt release-files/build-info.json
          release-files/APK-VERIFICATION.txt release-files/APK-MANIFEST.txt
          --target "$SOURCE_SHA" --prerelease
          --title "HIM & I · Android preview ${BUILD_NUMBER}"
          --notes-file release-files/RELEASE_NOTES.md
